<!doctype html>
<html>
<head><meta charset="utf-8"><title>Datum Connect — 3-Tunnel Demo</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0b1220; color: #e6edf3; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; margin: 0; gap: 2.5rem; padding: 2.5rem 1rem 3.5rem; box-sizing: border-box; }
  .card { text-align: center; padding: 2rem 3rem; border: 1px solid #30363d; border-radius: 12px; background: #161b22; }
  h1 { color: #58a6ff; }
  code { background: #0d1117; padding: 2px 8px; border-radius: 4px; }

  .map-section { width: 100%; max-width: 950px; }
  .map-section h2 { text-align: center; font-size: 1rem; font-weight: 600; color: #8b949e; text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 1rem; }
  .map-card { border: 1px solid #30363d; border-radius: 12px; background: #161b22; padding: 1.5rem 1rem 1rem; }
  .map-card svg { width: 100%; height: auto; display: block; }
  .map-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.5rem; margin-top: 1rem; font-size: 0.8rem; color: #c9d1d9; }
  .map-legend .swatch { display: inline-flex; align-items: center; gap: 0.5rem; }
  .map-legend .line { width: 22px; height: 4px; border-radius: 2px; display: inline-block; }
  .station-label { fill: #e6edf3; font-size: 13px; font-family: system-ui, sans-serif; }
  .station-caption { fill: #8b949e; font-size: 10.5px; font-family: system-ui, sans-serif; }
  .zone-label { fill: #8b949e; font-size: 11px; font-family: system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="card">
    <h1>3 connections, 1 sandbox</h1>
    <p>This page is served <strong>on a Daytona sandbox</strong> — reached over a Datum</p>
    <p>P2P tunnel, relayed out through a Datum Cloud tunnel. No public IP anywhere.</p>
    <p><code id="ts"></code></p>
  </div>

  <div class="map-section">
    <h2>How this demo is wired</h2>
    <div class="map-card">
      <svg viewBox="0 0 950 420" preserveAspectRatio="xMidYMid meet">
        <!-- Daytona sandbox zone: this is where everything actually runs -->
        <rect x="40" y="40" width="220" height="330" rx="14" fill="none" stroke="#30363d" stroke-width="2" stroke-dasharray="6 5"/>
        <text x="150" y="26" text-anchor="middle" class="zone-label">Daytona sandbox — hosts everything, no inbound reachability of its own</text>

        <!-- Green P2P lines: each sandbox service -> the laptop relay -->
        <polyline points="200,110 480,220" stroke="#3fb950" stroke-width="5" fill="none" stroke-linecap="round"/>
        <polyline points="200,220 480,220" stroke="#3fb950" stroke-width="5" fill="none" stroke-linecap="round"/>
        <polyline points="200,330 480,220" stroke="#3fb950" stroke-width="5" fill="none" stroke-linecap="round"/>

        <!-- Blue Cloud-tunnel lines: laptop relay -> Datum Cloud Proxy -> Internet (web + dashboard only) -->
        <polyline points="480,220 690,150" stroke="#58a6ff" stroke-width="5" fill="none" stroke-linecap="round"/>
        <polyline points="480,220 690,195" stroke="#58a6ff" stroke-width="5" fill="none" stroke-linecap="round"/>
        <polyline points="690,150 880,150" stroke="#58a6ff" stroke-width="5" fill="none" stroke-linecap="round"/>
        <polyline points="690,195 880,195" stroke="#58a6ff" stroke-width="5" fill="none" stroke-linecap="round"/>

        <!-- Sandbox stations (origins) -->
        <circle cx="200" cy="110" r="9" fill="#0b1220" stroke="#3fb950" stroke-width="4"/>
        <text x="80" y="105" text-anchor="start" class="station-label">SSH :22</text>
        <text x="80" y="122" text-anchor="start" class="station-caption">this page's shell, live</text>

        <circle cx="200" cy="220" r="9" fill="#0b1220" stroke="#3fb950" stroke-width="4"/>
        <text x="80" y="215" text-anchor="start" class="station-label">Web page :8899</text>
        <text x="80" y="232" text-anchor="start" class="station-caption">this page, served here</text>

        <circle cx="200" cy="330" r="9" fill="#0b1220" stroke="#3fb950" stroke-width="4"/>
        <text x="80" y="325" text-anchor="start" class="station-label">Dashboard :47780</text>
        <text x="80" y="342" text-anchor="start" class="station-caption">this sandbox's own daemon UI</text>

        <!-- Relay: My Laptop -->
        <circle cx="480" cy="220" r="11" fill="#161b22" stroke="#3fb950" stroke-width="4"/>
        <circle cx="480" cy="220" r="5" fill="#3fb950"/>
        <text x="480" y="255" text-anchor="middle" class="station-label">My Laptop</text>
        <text x="480" y="271" text-anchor="middle" class="station-caption">relay only — holds the real Datum project</text>
        <text x="480" y="284" text-anchor="middle" class="station-caption">credentials, hosts no content itself</text>
        <text x="440" y="200" text-anchor="middle" class="station-caption" fill="#3fb950">SSH stops here — operator-only</text>

        <!-- Interchange: Datum Cloud Proxy -->
        <circle cx="690" cy="172" r="11" fill="#161b22" stroke="#58a6ff" stroke-width="4"/>
        <circle cx="690" cy="172" r="5" fill="#58a6ff"/>
        <text x="690" y="140" text-anchor="middle" class="station-label">Datum Cloud Proxy</text>
        <text x="690" y="124" text-anchor="middle" class="station-caption">*.datumproxy.net — single public gate</text>

        <!-- Endpoint: Internet -->
        <circle cx="880" cy="150" r="9" fill="#0b1220" stroke="#58a6ff" stroke-width="4"/>
        <text x="880" y="130" text-anchor="middle" class="station-label">Internet</text>
        <text x="880" y="115" text-anchor="middle" class="station-caption">web page visitors</text>

        <circle cx="880" cy="195" r="9" fill="#0b1220" stroke="#58a6ff" stroke-width="4"/>
        <text x="880" y="215" text-anchor="middle" class="station-label">Internet</text>
        <text x="880" y="230" text-anchor="middle" class="station-caption">dashboard viewers</text>
      </svg>
      <div class="map-legend">
        <span class="swatch"><span class="line" style="background:#3fb950"></span> P2P tunnel — direct, hole-punched, no proxy involved</span>
        <span class="swatch"><span class="line" style="background:#58a6ff"></span> Cloud tunnel — via Datum Cloud's own proxy fleet</span>
      </div>
    </div>
  </div>

  <script>document.getElementById('ts').textContent = new Date().toString();</script>
</body>
</html>
