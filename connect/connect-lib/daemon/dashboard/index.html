<!doctype html>
<!-- Dark mode is permanent: `dark` is set statically rather than through a
     ThemeProvider, so there's no flash and no toggle. -->
<html lang="en" class="dark theme-alpha bg-background">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Datum Connect — Dashboard</title>
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
