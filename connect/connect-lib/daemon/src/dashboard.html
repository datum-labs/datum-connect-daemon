<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Datum Connect — Dashboard</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #12181f;
    --panel-2: #171f28;
    --border: #232d38;
    --text: #d8e1ea;
    --text-dim: #7c8a99;
    --accent: #5cc8ff;
    --good: #4fd67a;
    --bad: #ff6b6b;
    --warn: #f5c86b;
    --mono: "SF Mono", "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  header h1 span { color: var(--text-dim); font-weight: 400; }
  .token-box {
    margin-left: auto;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  input[type="password"], input[type="text"] {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 12px;
    width: 280px;
  }
  button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); color: #06131c; border-color: var(--accent); font-weight: 600; }
  button.primary:hover { opacity: 0.9; color: #06131c; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .dot.ok { background: var(--good); }
  .dot.bad { background: var(--bad); }
  .dot.warn { background: var(--warn); }
  main {
    display: grid;
    grid-template-columns: 320px 1fr;
    height: calc(100vh - 53px);
  }
  .col { border-right: 1px solid var(--border); overflow-y: auto; }
  .col:last-child { border-right: none; }
  .section-title {
    padding: 10px 16px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
  }
  .tunnel-item {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .tunnel-item:hover { background: var(--panel); }
  .tunnel-item.active { background: var(--panel-2); border-left: 3px solid var(--accent); }
  .tunnel-item .label { font-weight: 600; }
  .tunnel-item .host { color: var(--text-dim); font-family: var(--mono); font-size: 12px; margin-top: 2px; }
  .tunnel-item .meta { color: var(--text-dim); font-family: var(--mono); font-size: 11px; margin-top: 4px; }
  .tunnel-filter-note {
    padding: 8px 16px;
    font-size: 11px;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
  }
  .link-toggle { color: var(--accent); cursor: pointer; text-decoration: underline; }
  .link-toggle:hover { opacity: 0.8; }
  .badge {
    display: inline-block;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 4px;
    margin-top: 6px;
    margin-right: 4px;
    font-family: var(--mono);
  }
  .badge.on { background: rgba(79,214,122,0.15); color: var(--good); }
  .badge.off { background: rgba(124,138,153,0.15); color: var(--text-dim); }
  .badge.agent { background: rgba(245,200,107,0.15); color: var(--warn); }
  .detail { padding: 20px; }
  .detail h2 { margin: 0 0 4px 0; font-size: 18px; }
  .detail .sub { color: var(--text-dim); font-family: var(--mono); font-size: 12px; margin-bottom: 16px; }
  .steps { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .stat-row { display: flex; flex-wrap: wrap; gap: 24px; margin-bottom: 24px; }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 14px;
    min-width: 110px;
  }
  .stat .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-dim); }
  .stat .value { font-family: var(--mono); font-size: 15px; font-weight: 600; margin-top: 2px; }
  .stat .value.bad { color: var(--bad); }
  .portal-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--accent);
    text-decoration: none;
    margin-bottom: 16px;
  }
  .portal-link:hover { text-decoration: underline; }
  .step {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
    min-width: 150px;
  }
  .step .kind { font-family: var(--mono); color: var(--text-dim); font-size: 10px; text-transform: uppercase; }
  .step .status { font-weight: 600; margin-top: 2px; }
  .step.ready { border-color: rgba(79,214,122,0.3); }
  .step.ready .status { color: var(--good); }
  .step.pending .status { color: var(--warn); }
  table { width: 100%; border-collapse: collapse; }
  th, td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  th { color: var(--text-dim); font-weight: 500; text-transform: uppercase; font-size: 10px; letter-spacing: 0.4px; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: var(--panel); }
  .method { font-family: var(--mono); font-weight: 600; }
  .status-code { font-family: var(--mono); }
  .status-code.s2xx { color: var(--good); }
  .status-code.s4xx, .status-code.s5xx { color: var(--bad); }
  .empty { color: var(--text-dim); padding: 40px; text-align: center; }
  .peer-item {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .peer-item .label { font-weight: 600; }
  .peer-item .host { color: var(--text-dim); font-family: var(--mono); font-size: 11px; margin-top: 2px; }
  .peer-item .meta { color: var(--text-dim); font-family: var(--mono); font-size: 11px; margin-top: 4px; }
  .peer-item.clickable { cursor: pointer; }
  .peer-item.clickable:hover { background: var(--panel); }
  .peer-item.active { background: var(--panel-2); border-left: 3px solid var(--accent); }
  .peer-section-empty { color: var(--text-dim); padding: 12px 16px; font-size: 12px; }
  .log-detail-pre { max-height: calc(100vh - 220px); overflow-y: auto; }
  .log-caption { padding: 6px 16px 8px; font-size: 11px; color: var(--text-dim); border-bottom: 1px solid var(--border); line-height: 1.4; }
  .copy-host { display: inline-flex; align-items: center; gap: 4px; }
  .copy-btn {
    background: none; border: none; color: var(--text-dim); cursor: pointer;
    font-size: 11px; padding: 0 2px; line-height: 1; border-radius: 3px;
  }
  .copy-btn:hover { color: var(--accent); }
  .conn-type { display: inline-block; font-size: 10px; font-family: var(--mono); padding: 1px 6px; border-radius: 4px; margin-left: 6px; }
  .conn-type.direct { background: rgba(79,214,122,0.15); color: var(--good); }
  .conn-type.relay { background: rgba(245,200,107,0.15); color: var(--warn); }
  .conn-type.mixed { background: rgba(245,200,107,0.15); color: var(--warn); }
  .conn-type.unknown { background: rgba(124,138,153,0.15); color: var(--text-dim); }
  .conn-transitions { color: var(--warn); }
  .log-search { width: 100%; max-width: 420px; display: block; margin-bottom: 12px; }
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center; z-index: 10;
  }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    width: 720px; max-height: 80vh; overflow-y: auto; padding: 20px;
  }
  .modal-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px; }
  .modal h3 { margin: 0; font-family: var(--mono); font-size: 14px; }
  .kv { display: grid; grid-template-columns: 140px 1fr; gap: 4px 12px; font-size: 12px; margin-bottom: 16px; }
  .kv .k { color: var(--text-dim); }
  .kv .v { font-family: var(--mono); word-break: break-all; }
  pre {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 12px; overflow-x: auto; font-size: 11px; font-family: var(--mono);
    white-space: pre-wrap; word-break: break-all;
  }
  .hdr-block { margin-bottom: 12px; }
  .hdr-block h4 { font-size: 11px; text-transform: uppercase; color: var(--text-dim); margin: 0 0 6px 0; }
  .toast {
    position: fixed; bottom: 20px; right: 20px; background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px;
    font-size: 12px; z-index: 20;
  }
  .toast.err { border-color: var(--bad); color: var(--bad); }
  .toast.ok { border-color: var(--good); color: var(--good); }
  .toast.warn { border-color: var(--warn); color: var(--warn); }
</style>
</head>
<body>

<header>
  <h1>Datum Connect <span>· dashboard (read-only)</span></h1>
  <div class="token-box">
    <span id="conn-dot" class="dot bad"></span>
    <input id="token-input" type="password" placeholder="Viewer token (tunnel api viewer-token create)" />
    <button id="token-save" class="primary">Connect</button>
  </div>
</header>

<main>
  <div class="col" id="tunnel-list-col">
    <div class="section-title">Tunnels</div>
    <div id="tunnel-list"><div class="empty">Enter a token to connect</div></div>
    <div class="section-title">Peer tunnels (P2P, no Datum involved)</div>
    <div id="peer-list"><div class="peer-section-empty">—</div></div>
    <div class="section-title">Logs</div>
    <div class="log-caption" id="logs-caption"></div>
    <div id="logs-list"><div class="empty">Enter a token to connect</div></div>
  </div>
  <div class="col" id="detail-col">
    <div class="empty">Select a tunnel, log, or peer connection</div>
  </div>
</main>

<div id="modal-root"></div>

<script>
const state = { token: localStorage.getItem('dc_token') || '', tunnels: [], selected: null, traffic: [], info: null, logSources: [], selectedLog: null, logLines: [], logSearch: '', peerData: null, selectedPeer: null, showAllTunnels: false };

function humanizeBytes(bytes) {
  const units = ['B', 'KB', 'MB', 'GB', 'TB'];
  if (!bytes) return '0 B';
  let size = bytes, i = 0;
  while (size >= 1024 && i < units.length - 1) { size /= 1024; i++; }
  return size.toFixed(1) + ' ' + units[i];
}

fetch('/v1/info').then(r => r.json()).then(info => { state.info = info; renderLogsCaption(); renderTunnelList(); }).catch(() => {});

const $ = (sel) => document.querySelector(sel);
const tunnelListEl = $('#tunnel-list');
const peerListEl = $('#peer-list');
const logsListEl = $('#logs-list');
const logsCaptionEl = $('#logs-caption');
const detailEl = $('#detail-col');
const tokenInput = $('#token-input');
const connDot = $('#conn-dot');

tokenInput.value = state.token;

$('#token-save').addEventListener('click', () => {
  state.token = tokenInput.value.trim();
  localStorage.setItem('dc_token', state.token);
  refreshTunnels();
});

function toast(msg, kind, durationMs) {
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), durationMs || 3500);
}

function isAgentActor(actor) {
  return !!actor && actor.startsWith('operate:');
}

// Wraps a hostname / IP:port value with a small inline copy button. Used
// everywhere one of those is displayed (tunnel list/detail, peer
// advertisements/connections) rather than per-section, so the behavior
// (and its escaping) stays consistent in one place.
function copyableHost(text) {
  if (!text) return '';
  const esc = escapeHtml(text);
  return `<span class="copy-host">${esc}<button type="button" class="copy-btn" data-copy="${esc}" title="Copy to clipboard">⧉</button></span>`;
}

// One delegated listener rather than re-binding after every re-render —
// `.copy-btn`s get replaced wholesale by `innerHTML` assignments constantly
// throughout this page.
document.addEventListener('click', async (e) => {
  const btn = e.target.closest('.copy-btn');
  if (!btn) return;
  e.stopPropagation(); // don't also trigger a parent row's select handler
  try {
    await navigator.clipboard.writeText(btn.dataset.copy);
    const original = btn.textContent;
    btn.textContent = '✓';
    btn.disabled = true;
    setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1000);
  } catch (err) {
    toast('Copy failed: ' + err.message, 'err');
  }
});

async function api(path, opts) {
  const res = await fetch(path, Object.assign({
    headers: { 'Authorization': 'Bearer ' + state.token }
  }, opts || {}));
  if (!res.ok) {
    let body = {};
    try { body = await res.json(); } catch (e) {}
    throw new Error((body && body.error) || ('HTTP ' + res.status));
  }
  return res.json();
}

function statusClass(code) {
  if (code >= 200 && code < 300) return 's2xx';
  if (code >= 400 && code < 500) return 's4xx';
  if (code >= 500) return 's5xx';
  return '';
}

function renderTunnelList() {
  if (!state.tunnels.length) {
    tunnelListEl.innerHTML = '<div class="empty">No tunnels</div>';
    return;
  }
  // Default to this device's own tunnels — a shared project can accumulate
  // tunnels from many machines (other laptops, cloud test boxes), and those
  // are noise for "what's running here right now". connector_device is set
  // server-side from the same friendly_device_name() this daemon reports at
  // /v1/info, so an exact match is a reliable "created from this machine"
  // signal without needing per-tunnel local state.
  const deviceName = state.info && state.info.device_name;
  const isLocal = t => deviceName && t.connector_device === deviceName;
  const localTunnels = state.tunnels.filter(isLocal);
  const shown = state.showAllTunnels ? state.tunnels : localTunnels;

  const toggle = state.tunnels.length !== localTunnels.length
    ? `<div class="tunnel-filter-note">
         Showing ${shown.length} of ${state.tunnels.length} tunnels in project
         · <span class="link-toggle" id="toggle-all-tunnels">${state.showAllTunnels ? 'show only this device' : 'show all'}</span>
       </div>`
    : '';

  const list = !shown.length
    ? '<div class="empty">No tunnels on this device</div>'
    : shown.map(t => `
    <div class="tunnel-item ${state.selected === t.id ? 'active' : ''}" data-id="${t.id}">
      <div class="label">${escapeHtml(t.label)}</div>
      <div class="host">${(t.hostnames && t.hostnames[0]) ? copyableHost(t.hostnames[0]) : (t.endpoint ? copyableHost(t.endpoint) : '(no hostname yet)')}</div>
      <span class="badge ${t.enabled ? 'on' : 'off'}">${t.enabled ? 'ON' : 'OFF'}</span>
      ${t.connector_ready ? '<span class="badge on">connector ready</span>' : ''}
      ${t.enabled && isAgentActor(t.last_start_actor) ? '<span class="badge agent">🤖 started by agent</span>' : ''}
      ${state.showAllTunnels && !isLocal(t) ? `<div class="meta">on ${escapeHtml(t.connector_device || 'unknown device')}</div>` : ''}
    </div>
  `).join('');

  tunnelListEl.innerHTML = toggle + list;
  const toggleEl = document.getElementById('toggle-all-tunnels');
  if (toggleEl) {
    toggleEl.addEventListener('click', () => {
      state.showAllTunnels = !state.showAllTunnels;
      renderTunnelList();
    });
  }
  tunnelListEl.querySelectorAll('.tunnel-item').forEach(el => {
    el.addEventListener('click', () => selectTunnel(el.dataset.id));
  });
}

function renderPeerList(data) {
  if (!data) {
    peerListEl.innerHTML = '<div class="peer-section-empty">—</div>';
    return;
  }
  const parts = [];

  if (data.endpoint_id) {
    parts.push(`<div class="peer-item"><div class="meta">This daemon's peer id: ${escapeHtml(data.endpoint_id.slice(0, 16))}…</div></div>`);
  }

  if (!data.advertisements.length && !data.connections.length) {
    parts.push('<div class="peer-section-empty">No peer advertisements or connections</div>');
  }

  // Both advertisements and connections open in the right-hand detail pane
  // on click, same list-then-detail pattern as tunnels and logs.
  data.advertisements.forEach(a => {
    const active = state.selectedPeer && state.selectedPeer.kind === 'ad' && state.selectedPeer.id === a.resource_id;
    parts.push(`
      <div class="peer-item clickable ${active ? 'active' : ''}" data-peer-kind="ad" data-peer-id="${escapeHtml(a.resource_id)}">
        <div class="label">↑ ${escapeHtml(a.label)}</div>
        <div class="host">${copyableHost(a.endpoint)}</div>
        <span class="badge ${a.enabled ? 'on' : 'off'}">${a.enabled ? 'ADVERTISING' : 'REVOKED'}</span>
        <div class="meta">sent ${humanizeBytes(a.bytes_from_origin)} · received ${humanizeBytes(a.bytes_to_origin)}</div>
      </div>
    `);
  });

  // conn_type/latency_ms come straight from iroh (Endpoint::conn_type/
  // latency) — "direct" means a real hole-punched peer-to-peer path,
  // "relay"/"mixed" mean it's bouncing through (or partly through) a relay
  // server. See NOTES.md's "what does iroh give us" discussion.
  data.connections.forEach(c => {
    const typeClass = c.conn_type || 'unknown';
    const typeBadge = `<span class="conn-type ${escapeHtml(typeClass)}">${escapeHtml(typeClass)}</span>`;
    const latency = (c.latency_ms != null) ? ` · ${c.latency_ms}ms` : '';
    const detail = c.conn_detail ? ` (${escapeHtml(c.conn_detail)})` : '';
    // transition_count > 0 means this connection has flipped between
    // direct/relay at least once since it was established (e.g. hole-
    // punching succeeded partway through, or a direct path degraded) —
    // each flip is also a `peer_connection_<type>` audit event.
    const transitions = c.transition_count > 0
      ? ` · <span class="conn-transitions">${c.transition_count} change${c.transition_count === 1 ? '' : 's'}</span>`
      : '';
    const active = state.selectedPeer && state.selectedPeer.kind === 'conn' && state.selectedPeer.id === c.id;
    parts.push(`
      <div class="peer-item clickable ${active ? 'active' : ''}" data-peer-kind="conn" data-peer-id="${escapeHtml(c.id)}">
        <div class="label">↓ connected via ${copyableHost(c.bound_addr)}</div>
        <div class="host">→ ${copyableHost(c.target)} (${escapeHtml(c.remote_endpoint_id.slice(0, 16))}…)</div>
        <div class="meta">${typeBadge}${latency}${detail}${transitions}</div>
      </div>
    `);
  });

  if (data.connect_metrics) {
    const m = data.connect_metrics;
    parts.push(`
      <div class="peer-item">
        <div class="meta">All outbound peer connections combined — sent ${humanizeBytes(m.bytes_to_upstream)} · received ${humanizeBytes(m.bytes_from_upstream)} · ${m.active_iroh_connections} active / ${m.total_iroh_connections} total</div>
      </div>
    `);
  }

  peerListEl.innerHTML = parts.join('');
  peerListEl.querySelectorAll('[data-peer-kind]').forEach(el => {
    el.addEventListener('click', () => selectPeer(el.dataset.peerKind, el.dataset.peerId));
  });
}

function selectPeer(kind, id) {
  state.selectedPeer = { kind, id };
  state.selected = null;
  state.selectedLog = null;
  state.logLines = [];
  state.logSearch = '';
  renderTunnelList();
  renderLogList();
  renderPeerList(state.peerData);
  renderPeerDetail();
}

// Only re-renders when a peer is actually selected — called on every 3s
// peer poll (to keep bytes/latency live) and right after selectPeer.
function renderPeerDetail() {
  if (!state.selectedPeer || !state.peerData) return;
  const { kind, id } = state.selectedPeer;

  if (kind === 'ad') {
    const a = state.peerData.advertisements.find(x => x.resource_id === id);
    if (!a) { deselectMissingPeer(); return; }
    detailEl.innerHTML = `
      <div class="detail">
        <h2>↑ ${escapeHtml(a.label)}</h2>
        <div class="sub">${copyableHost(a.endpoint)} <span class="badge ${a.enabled ? 'on' : 'off'}">${a.enabled ? 'ADVERTISING' : 'REVOKED'}</span></div>
        <div class="stat-row">
          <div class="stat"><div class="label">Sent</div><div class="value">${humanizeBytes(a.bytes_from_origin)}</div></div>
          <div class="stat"><div class="label">Received</div><div class="value">${humanizeBytes(a.bytes_to_origin)}</div></div>
        </div>
        <div class="kv">
          <div class="k">Resource id</div><div class="v">${escapeHtml(a.resource_id)}</div>
        </div>
      </div>
    `;
    return;
  }

  const c = state.peerData.connections.find(x => x.id === id);
  if (!c) { deselectMissingPeer(); return; }
  const typeClass = c.conn_type || 'unknown';
  detailEl.innerHTML = `
    <div class="detail">
      <h2>↓ P2P connection</h2>
      <div class="sub">${copyableHost(c.bound_addr)} → ${copyableHost(c.target)}</div>
      <div class="stat-row">
        <div class="stat"><div class="label">Type</div><div class="value"><span class="conn-type ${escapeHtml(typeClass)}">${escapeHtml(typeClass)}</span></div></div>
        <div class="stat"><div class="label">Latency</div><div class="value">${c.latency_ms != null ? c.latency_ms + 'ms' : '—'}</div></div>
        <div class="stat"><div class="label">Type changes</div><div class="value">${c.transition_count}</div></div>
      </div>
      <div class="kv">
        <div class="k">Remote peer id</div><div class="v">${escapeHtml(c.remote_endpoint_id)}</div>
        ${c.conn_detail ? `<div class="k">Path</div><div class="v">${escapeHtml(c.conn_detail)}</div>` : ''}
      </div>
      ${c.transition_count > 0 ? '<div class="sub" style="margin-top:8px;">Each type change (e.g. relay → direct once hole-punching succeeds) is also recorded in the audit log.</div>' : ''}
    </div>
  `;
}

// The selected advertisement/connection vanished (revoked/disconnected,
// possibly from another client) since the last poll.
function deselectMissingPeer() {
  state.selectedPeer = null;
  detailEl.innerHTML = '<div class="empty">Select a tunnel, log, or peer connection</div>';
}

async function refreshPeers() {
  if (!state.token) {
    peerListEl.innerHTML = '<div class="peer-section-empty">—</div>';
    state.peerData = null;
    return;
  }
  try {
    state.peerData = await api('/v1/peers');
    renderPeerList(state.peerData);
    if (state.selectedPeer) renderPeerDetail();
  } catch (e) {
    peerListEl.innerHTML = `<div class="peer-section-empty">${escapeHtml(e.message)}</div>`;
  }
}

// Log tail section — see LOG-TAIL-PLAN.md. Which files are tailable is a
// setup-only decision made outside the dashboard entirely (CLI/API); the
// dashboard is a pure viewer, same as every other section here. How many
// lines are shown is the daemon's own configured cap (--log-tail-max-lines
// / DATUM_LOG_TAIL_MAX_LINES, via /v1/info) — not a UI input, and not a
// separate client-side constant either, so there's exactly one number
// governing "how much history you can see" and it's the one shown below.
//
// Left nav is just a list of names (same shape as the tunnel list);
// clicking one shows its tail in the right-hand detail pane — same
// list-then-detail pattern as tunnels, rather than inline per-source blocks.
const FALLBACK_LOG_TAIL_MAX_LINES = 1000; // used only until /v1/info resolves

function logTailMaxLines() {
  return (state.info && state.info.log_tail_max_lines) || FALLBACK_LOG_TAIL_MAX_LINES;
}

function renderLogsCaption() {
  logsCaptionEl.textContent =
    `Showing up to ${logTailMaxLines()} lines. If a log file rotates, ` +
    `you may lose the earlier lines from this view.`;
}
renderLogsCaption(); // render once immediately with the fallback, corrected once /v1/info resolves

function renderLogList() {
  if (!state.logSources.length) {
    logsListEl.innerHTML = '<div class="empty">No log sources registered</div>';
    return;
  }
  logsListEl.innerHTML = state.logSources.slice().sort((a, b) => a.name.localeCompare(b.name)).map(src => `
    <div class="tunnel-item ${state.selectedLog === src.name ? 'active' : ''}" data-log="${escapeHtml(src.name)}">
      <div class="label">${escapeHtml(src.name)}</div>
      <div class="host">${src.exists ? humanizeBytes(src.size_bytes) : '(no file yet)'}</div>
    </div>
  `).join('');
  logsListEl.querySelectorAll('[data-log]').forEach(el => {
    el.addEventListener('click', () => selectLog(el.dataset.log));
  });
}

// Bumped on every selectLog call so an in-flight tail fetch for a
// previously-selected log can tell it's been superseded before it paints
// its (now stale) response into the shared detail pane — found in review
// 2026-09-07: switching logs quickly, or an overlapping 3s poll, could
// otherwise let an old response overwrite the currently-displayed log.
let logDetailGeneration = 0;

async function selectLog(name) {
  state.selectedLog = name;
  logDetailGeneration++;
  state.selected = null; // right pane shows one thing at a time
  state.selectedPeer = null;
  state.logLines = [];
  state.logSearch = '';
  renderTunnelList();
  renderLogList();
  if (state.peerData) renderPeerList(state.peerData);
  const src = state.logSources.find(s => s.name === name);
  detailEl.innerHTML = `
    <div class="detail">
      <h2>${escapeHtml(name)}</h2>
      <div class="sub">${escapeHtml(src ? src.path : '')}${src && !src.exists ? ' (no file yet)' : ''}</div>
      <input type="text" id="log-search" class="log-search" placeholder="Filter lines (e.g. Error)…" />
      <pre class="log-detail-pre" id="log-detail-pre"></pre>
    </div>
  `;
  $('#log-search').addEventListener('input', (e) => {
    state.logSearch = e.target.value;
    renderLogPre();
  });
  await refreshLogDetail();
}

// Only fetches/updates the tail for whichever log is actually selected —
// unlike an earlier version of this section, sources you aren't looking at
// don't get tailed every poll.
async function refreshLogDetail() {
  if (!state.selectedLog) return;
  const myGeneration = logDetailGeneration;
  try {
    const res = await api('/v1/logs/' + state.selectedLog + '/tail?lines=' + logTailMaxLines());
    if (myGeneration !== logDetailGeneration) return; // superseded by a newer selection
    state.logLines = res.lines;
  } catch (e) {
    if (myGeneration !== logDetailGeneration) return;
    state.logLines = [e.message];
  }
  renderLogPre();
}

// Applies the filter box (client-side substring match over whatever's
// currently loaded — see LOG-TAIL-PLAN.md's search section) and paints the
// result. Called both after a fresh fetch and on every keystroke, so typing
// doesn't need a round-trip to the daemon.
function renderLogPre() {
  const pre = document.getElementById('log-detail-pre');
  if (!pre) return; // detail pane isn't showing this log's scaffold (e.g. mid-transition)
  const term = state.logSearch.trim().toLowerCase();
  const lines = term ? state.logLines.filter(l => l.toLowerCase().includes(term)) : state.logLines;
  // Only stick to the bottom on new content if the viewer was already
  // there — don't yank someone back down mid-scroll-up.
  const wasNearBottom = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 30;
  pre.textContent = lines.length ? lines.join('\n') : (term ? '(no matching lines)' : '(empty)');
  if (wasNearBottom) pre.scrollTop = pre.scrollHeight;
}

async function refreshLogs() {
  if (!state.token) {
    logsListEl.innerHTML = '<div class="empty">Enter a token to connect</div>';
    state.logSources = [];
    return;
  }
  try {
    state.logSources = await api('/v1/logs');
  } catch (e) {
    logsListEl.innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`;
    return;
  }
  renderLogList();
  // A source removed elsewhere (e.g. via CLI) while selected — drop back to
  // the empty state rather than tailing a now-nonexistent registration.
  if (state.selectedLog && !state.logSources.some(s => s.name === state.selectedLog)) {
    state.selectedLog = null;
    state.logLines = [];
    state.logSearch = '';
    if (!state.selected && !state.selectedPeer) detailEl.innerHTML = '<div class="empty">Select a tunnel, log, or peer connection</div>';
    return;
  }
  await refreshLogDetail();
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function selectTunnel(id) {
  state.selected = id;
  state.selectedLog = null; // right pane shows one thing at a time
  state.selectedPeer = null;
  state.logLines = [];
  state.logSearch = '';
  renderTunnelList();
  renderLogList();
  if (state.peerData) renderPeerList(state.peerData);
  await refreshDetail();
}

async function refreshDetail() {
  if (!state.selected) return;
  try {
    const [progress, traffic, metrics] = await Promise.all([
      api('/v1/tunnels/' + state.selected + '/progress'),
      api('/v1/tunnels/' + state.selected + '/traffic'),
      api('/v1/tunnels/' + state.selected + '/metrics').catch(() => null),
    ]);
    state.traffic = traffic;
    const tunnel = state.tunnels.find(t => t.id === state.selected);
    renderDetail(tunnel, progress, traffic, metrics);
  } catch (e) {
    detailEl.innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`;
  }
}

function portalUrl(tunnel) {
  if (!state.info || !tunnel) return null;
  return `${state.info.portal_base_url}/project/${state.info.project_id}/edge/${tunnel.id}/overview`;
}

function renderDetail(tunnel, progress, traffic, metrics) {
  const stepsHtml = (progress.steps || []).map(s => `
    <div class="step ${s.status === 'ready' ? 'ready' : 'pending'}">
      <div class="kind">${escapeHtml(s.kind)}</div>
      <div class="status">${escapeHtml(s.status)}</div>
    </div>
  `).join('');

  const url = portalUrl(tunnel);
  const portalLinkHtml = url
    ? `<a class="portal-link" href="${url}" target="_blank" rel="noopener">Open in cloud.datum.net (WAF, routing, etc.) ↗</a>`
    : '';

  const statsHtml = metrics ? `
    <div class="stat-row">
      <div class="stat"><div class="label">Sent</div><div class="value">${humanizeBytes(metrics.bytes_to_origin)}</div></div>
      <div class="stat"><div class="label">Received</div><div class="value">${humanizeBytes(metrics.bytes_from_origin)}</div></div>
      <div class="stat"><div class="label">Active conns</div><div class="value">${metrics.active_iroh_connections}</div></div>
      <div class="stat"><div class="label">Total conns</div><div class="value">${metrics.total_iroh_connections}</div></div>
      <div class="stat"><div class="label">Active reqs</div><div class="value">${metrics.active_requests}</div></div>
      <div class="stat"><div class="label">Failed reqs</div><div class="value ${metrics.failed_requests ? 'bad' : ''}">${metrics.failed_requests}</div></div>
      <div class="stat"><div class="label">Denied reqs</div><div class="value ${metrics.denied_requests ? 'bad' : ''}">${metrics.denied_requests}</div></div>
    </div>
  ` : `<div class="empty" style="padding:12px 0;text-align:left;">Tunnel isn't running — no live network stats</div>`;

  const trafficRows = traffic.length
    ? traffic.slice().reverse().map(ex => `
        <tr class="clickable" data-ex="${ex.id}">
          <td class="method">${escapeHtml(ex.method)}</td>
          <td>${escapeHtml(ex.path)}</td>
          <td><span class="status-code ${statusClass(ex.response_status)}">${ex.response_status ?? '—'}</span></td>
          <td>${new Date(ex.timestamp_unix_ms).toLocaleTimeString()}</td>
        </tr>
      `).join('')
    : `<tr><td colspan="4" class="empty">No traffic captured yet</td></tr>`;

  const startedByHtml = (tunnel && tunnel.enabled && isAgentActor(tunnel.last_start_actor))
    ? `<div class="badge agent" style="margin-bottom:12px;">🤖 started by agent (${escapeHtml(tunnel.last_start_actor)})</div>`
    : '';

  detailEl.innerHTML = `
    <div class="detail">
      <h2>${escapeHtml(tunnel ? tunnel.label : state.selected)}</h2>
      <div class="sub">${copyableHost((progress.hostnames || [])[0] || '')}</div>
      ${startedByHtml}
      ${portalLinkHtml}
      <div class="steps">${stepsHtml}</div>
      ${statsHtml}
      <div class="section-title" style="padding-left:0;border:none;">Captured traffic</div>
      <table>
        <thead><tr><th>Method</th><th>Path</th><th>Status</th><th>Time</th></tr></thead>
        <tbody>${trafficRows}</tbody>
      </table>
    </div>
  `;
  detailEl.querySelectorAll('tr[data-ex]').forEach(el => {
    el.addEventListener('click', () => openExchange(el.dataset.ex));
  });
}

async function openExchange(exchangeId) {
  try {
    const ex = await api('/v1/tunnels/' + state.selected + '/traffic/' + exchangeId);
    renderExchangeModal(ex);
  } catch (e) {
    toast(e.message, 'err');
  }
}

function headersHtml(headers) {
  if (!headers || !headers.length) return '<div class="empty" style="padding:8px 0;">none</div>';
  return '<pre>' + headers.map(([k, v]) => escapeHtml(k) + ': ' + escapeHtml(v)).join('\n') + '</pre>';
}

function renderExchangeModal(ex) {
  const root = $('#modal-root');
  root.innerHTML = `
    <div class="overlay" id="overlay">
      <div class="modal">
        <div class="modal-header">
          <h3>${escapeHtml(ex.method)} ${escapeHtml(ex.path)}</h3>
          <button id="close-modal">Close</button>
        </div>
        <div class="kv">
          <div class="k">Status</div><div class="v">${ex.response_status ?? '—'}</div>
          <div class="k">Time</div><div class="v">${new Date(ex.timestamp_unix_ms).toLocaleString()}</div>
        </div>
        <div class="hdr-block"><h4>Request headers</h4>${headersHtml(ex.request.headers)}</div>
        <div class="hdr-block"><h4>Request body ${ex.request.body_truncated ? '(truncated)' : ''}</h4><pre>${escapeHtml(ex.request.body || '(empty)')}</pre></div>
        ${ex.response ? `
          <div class="hdr-block"><h4>Response headers</h4>${headersHtml(ex.response.headers)}</div>
          <div class="hdr-block"><h4>Response body ${ex.response.body_truncated ? '(truncated)' : ''}</h4><pre>${escapeHtml(ex.response.body || '(empty)')}</pre></div>
        ` : ''}
        <button id="replay-btn" class="primary" ${ex.request.body_truncated ? 'disabled title="truncated body cannot be replayed"' : ''}>Replay this request</button>
        <div id="replay-result"></div>
      </div>
    </div>
  `;
  $('#close-modal').addEventListener('click', () => root.innerHTML = '');
  $('#overlay').addEventListener('click', (e) => { if (e.target.id === 'overlay') root.innerHTML = ''; });
  $('#replay-btn').addEventListener('click', async () => {
    try {
      const result = await api('/v1/tunnels/' + state.selected + '/traffic/' + ex.id + '/replay', { method: 'POST' });
      $('#replay-result').innerHTML = `
        <div class="hdr-block" style="margin-top:16px;">
          <h4>Replay result — status ${result.status}</h4>
          ${headersHtml(result.headers)}
          <pre>${escapeHtml(result.body || '(empty)')}</pre>
        </div>
      `;
      toast('Replayed successfully', 'ok');
    } catch (e) {
      toast('Replay failed: ' + e.message, 'err');
    }
  });
}

async function refreshTunnels() {
  if (!state.token) {
    connDot.className = 'dot bad';
    tunnelListEl.innerHTML = '<div class="empty">Enter a token to connect</div>';
    return;
  }
  try {
    const previousTunnels = state.tunnels;
    state.tunnels = await api('/v1/tunnels');
    connDot.className = 'dot ok';
    // Visible signal: notice the moment an agent (an operate token, not a
    // human's setup token) turns a tunnel on — compared against the
    // previous poll so this fires once per start, not every 3s for as
    // long as it stays on. The persistent "started by agent" badge (see
    // renderTunnelList) is what answers "wait, why is that on" after the
    // toast is gone. See NOTES.md's "agent-friendly, human stays in
    // control" discussion, 2026-09-08 — picked over a heavier OS-level
    // notification since this reuses machinery the dashboard already has.
    state.tunnels.forEach(t => {
      const was = previousTunnels.find(p => p.id === t.id);
      const justTurnedOn = t.enabled && (!was || !was.enabled);
      if (justTurnedOn && isAgentActor(t.last_start_actor)) {
        toast(`Agent started tunnel "${t.label}"`, 'warn', 10000);
      }
    });
    renderTunnelList();
    if (state.selected) await refreshDetail();
  } catch (e) {
    connDot.className = 'dot bad';
    tunnelListEl.innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`;
  }
}

refreshTunnels();
refreshPeers();
refreshLogs();
setInterval(refreshTunnels, 3000);
setInterval(refreshPeers, 3000);
setInterval(refreshLogs, 3000);
</script>
</body>
</html>
