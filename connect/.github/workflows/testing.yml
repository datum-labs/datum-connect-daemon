name: testing

on:
  push:
    paths:
      - 'connect-plugin/**/*.go'
      - 'connect-plugin/go.mod'
      - 'connect-plugin/go.sum'
      - 'connect-lib/daemon/dashboard/**'

jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: connect-plugin/go.mod
      - name: Verify dependencies
        run: go mod verify
        working-directory: connect-plugin
      - name: Build
        run: go build ./...
        working-directory: connect-plugin
      - name: Test (known-good packages only)
        run: go test -timeout 5m ./internal/daemon ./internal/env ./internal/exec ./internal/pidfile ./internal/state ./internal/svcconfig
        working-directory: connect-plugin

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connect-lib/daemon/dashboard
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Committed dist/ is up to date
        run: git diff --exit-code -- dist/ || (echo "::error::dashboard/dist is stale — run 'task build:dashboard' and commit the result" && exit 1)
