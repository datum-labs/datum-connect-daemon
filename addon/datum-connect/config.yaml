# Home Assistant add-on manifest for the Datum Connect daemon.
#
# Reaches this Home Assistant from anywhere through a Datum tunnel, with no
# inbound ports opened on the router.
name: Datum Connect
version: "0.3.4"
slug: datum_connect
description: >-
  Reach this Home Assistant from anywhere over a Datum tunnel, with no inbound
  ports open on your router.
url: https://github.com/datum-labs/datum-connect-daemon
arch:
  - aarch64

# A prebuilt image, so the Supervisor pulls rather than builds. Building on the
# device is not an option here (see the Dockerfile), and pulling is what lets
# this install from the add-on store with no files copied onto the box.
# Published by .github/workflows/addon-daemon-arm64.yml, tagged with `version`
# above — bump `version` to ship an update; the Supervisor offers it as one.
#
# For local development from /addons/, delete this line and the Supervisor
# builds from the Dockerfile instead (with the binary placed in bin/).
image: "ghcr.io/datum-labs/{arch}-addon-datum-connect"

# We exec the daemon as the container's main process and want the Supervisor's
# restart-on-failure to act on *it*, not on an init shim that outlives it.
init: false

# So that 127.0.0.1 inside the container is the host's loopback, which is how
# the daemon reaches Home Assistant on :8123 without a mapped port.
host_network: true

# The "Datum Connect" page in Home Assistant: connecting to Datum, then the
# tunnel's status. Served by the add-on itself, through the Supervisor's
# ingress proxy, so it needs Home Assistant's login (admins only, the
# default for panel_admin).
#
# With host networking, the proxy connects to the hassio network's gateway,
# 172.30.32.1, from the Supervisor, 172.30.32.2 (supervisor/docker/app.py
# ip_address, docker/network.py). The page binds only there, never to every
# address, which here would be the LAN, and answers only the Supervisor; see
# connect/connect-lib/daemon/src/ingress.rs. The port is next to the
# daemon's 47780, fixed rather than dynamic (ingress_port: 0) so that the
# watchdog below can name it, and unlikely to clash with anything else on
# the host's network.
ingress: true
ingress_port: 47781
panel_icon: mdi:cloud-lock
panel_title: Datum Connect

startup: services
boot: auto

# The Supervisor restarts the add-on if this stops answering, once the
# watchdog is turned on on the Info tab (it is off by default). It dials the
# add-on's ip_address, which for a host-network add-on is 172.30.32.1, not
# loopback (supervisor/apps/app.py watchdog_application), so it watches the
# page's port: the daemon's own API (47780) listens on 127.0.0.1 only, and a
# watchdog on it could never connect. Both setup and the daemon serve this
# port. Note this only proves the process is alive; it says nothing about
# whether the tunnel is actually serving, which is a separate failure mode
# (see DOCS.md).
watchdog: "tcp://[HOST]:[PORT:47781]"

# A key file placed by hand is read from /share, which an add-on only sees if
# it asks for it. Read-only: the add-on never writes there.
map:
  - type: share
    read_only: true

# Lets run.sh ask the Supervisor which port Home Assistant serves on
# (GET /core/info, allowed for the default role). 8123 is only the default:
# the first real install was on port 80, and a hard-coded 8123 gave a 502.
# Also lets the page find the Supervisor's address (GET /network/info). The
# page's Re-pair and Unpair restart the add-on with POST
# /addons/self/restart, which, like /addons/self/info, needs no role.
hassio_api: true

# Pairing shows its approval link as a Home Assistant notification, where it
# can be clicked, which a log line cannot be. That is a call to Home
# Assistant Core's API (persistent_notification.create/dismiss) through the
# Supervisor's /core/api proxy, which only lets through add-ons with this
# set; hassio_api does not cover it. Reading the saved options while pairing
# waits for a project (/addons/self/options/config) needs neither.
# The page's Allow (trusted proxies, the last step of setup) needs it too: it uses Core's websocket
# API (http/config, http/config/configure, http/config/promote, all
# admin-only) through the Supervisor's /core/websocket, which relays as the
# Supervisor's own admin user. See connect-lib's datum_cloud/ha_core.rs.
homeassistant_api: true

# Pairing saves its key at /data/service-account.json. Leaving it out of
# backups keeps a long-lived credential out of every backup file; the cost is
# that a restored add-on has no key and pairs again (see DOCS.md). The
# Supervisor matches these against the file's full path from the right, so
# this names that one file. A pasted key is in the add-on's options, which
# are always backed up, so excluding its copy would gain nothing.
# pairing-session.json holds the approving person's login for up to 15
# minutes while pairing waits for a project, so that the restart Home
# Assistant offers on saving the options does not cost a second approval.
backup_exclude:
  - "service-account.json"
  - "pairing-session.json"

options:
  service_account_key: ""
  # Empty means "the project the key belongs to". When pairing, it is only
  # preselected on the Datum Connect page, where the project is chosen.
  project: ""
  service_account_key_file: "/share/datum-service-account.json"
  # Empty means "this Home Assistant, on whatever port it uses".
  target: ""
  tunnel_label: "home-assistant"
  log_level: "info"
  repair: false

schema:
  # A service account key JSON, pasted whole into a masked field. Optional:
  # without one the add-on pairs with Datum and makes its own (DOCS.md). A
  # pasted key always wins over a paired one, and clearing it goes back to
  # the paired key.
  #
  # It must be a service account, not a token from a personal login. Personal
  # sessions expire within days, cannot be renewed without a browser, and an
  # appliance that loses auth goes dark with no symptom but a failing hostname.
  service_account_key: "password?"
  # The Datum project the tunnel is created in. Left empty, it is read from
  # the key: a service account's client_email is <name>@<project>.identity...
  # Optional when pairing: the Datum Connect page lists the projects.
  project: "str?"
  # Where to read the key from when service_account_key is empty. Kept for
  # installs that already placed a file.
  service_account_key_file: "str?"
  # What the tunnel points at. Empty detects Home Assistant's own port.
  target: "str?"
  tunnel_label: "str?"
  log_level: "list(trace|debug|info|warn|error)?"
  # Forget the paired key and pair again on the next start. Stays on until
  # turned off, so every start re-pairs while it is on. The old service
  # account is left in Datum to delete by hand; the log names it.
  repair: "bool?"
