# Home Assistant add-on manifest for the Datum Connect daemon.
#
# Reaches this Home Assistant from anywhere through a Datum tunnel, with no
# inbound ports opened on the router.
name: Datum Connect
version: "0.2.0"
slug: datum_connect
description: >-
  Reach this Home Assistant from anywhere over a Datum tunnel, with no inbound
  ports open on your router.
url: https://github.com/datum-labs/datum-connect-daemon
arch:
  - aarch64

# A prebuilt image, so the Supervisor pulls rather than builds. Building on the
# device is not an option here (see the Dockerfile), and pulling is what lets
# this install from the add-on store with no files copied onto the box.
# Published by .github/workflows/addon-daemon-arm64.yml, tagged with `version`
# above — bump `version` to ship an update; the Supervisor offers it as one.
#
# For local development from /addons/, delete this line and the Supervisor
# builds from the Dockerfile instead (with the binary placed in bin/).
image: "ghcr.io/datum-labs/{arch}-addon-datum-connect"

# We exec the daemon as the container's main process and want the Supervisor's
# restart-on-failure to act on *it*, not on an init shim that outlives it.
init: false

# So that 127.0.0.1 inside the container is the host's loopback, which is how
# the daemon reaches Home Assistant on :8123 without a mapped port, and how the
# watchdog below reaches the daemon's own API.
host_network: true

startup: services
boot: auto

# The Supervisor restarts the add-on if this stops answering. Note this only
# proves the daemon's local API is alive — it says nothing about whether the
# tunnel is actually serving, which is a separate failure mode (see DOCS.md).
watchdog: "tcp://[HOST]:[PORT:47780]"

# A key file placed by hand is read from /share, which an add-on only sees if
# it asks for it. Read-only: the add-on never writes there.
map:
  - type: share
    read_only: true

# Lets run.sh ask the Supervisor which port Home Assistant serves on
# (GET /core/info, allowed for the default role). 8123 is only the default:
# the first real install was on port 80, and a hard-coded 8123 gave a 502.
hassio_api: true

# Pairing saves its key at /data/service-account.json. Leaving it out of
# backups keeps a long-lived credential out of every backup file; the cost is
# that a restored add-on has no key and pairs again (see DOCS.md). The
# Supervisor matches these against the file's full path from the right, so
# this names that one file. A pasted key is in the add-on's options, which
# are always backed up, so excluding its copy would gain nothing.
backup_exclude:
  - "service-account.json"

options:
  service_account_key: ""
  # Empty means "the project the key belongs to", or, when pairing, "the
  # only project the approving login can see".
  project: ""
  service_account_key_file: "/share/datum-service-account.json"
  # Empty means "this Home Assistant, on whatever port it uses".
  target: ""
  tunnel_label: "home-assistant"
  log_level: "info"
  repair: false

schema:
  # A service account key JSON, pasted whole into a masked field. Optional:
  # without one the add-on pairs with Datum and makes its own (DOCS.md). A
  # pasted key always wins over a paired one, and clearing it goes back to
  # the paired key.
  #
  # It must be a service account, not a token from a personal login. Personal
  # sessions expire within days, cannot be renewed without a browser, and an
  # appliance that loses auth goes dark with no symptom but a failing hostname.
  service_account_key: "password?"
  # The Datum project the tunnel is created in. Left empty, it is read from
  # the key: a service account's client_email is <name>@<project>.identity...
  project: "str?"
  # Where to read the key from when service_account_key is empty. Kept for
  # installs that already placed a file.
  service_account_key_file: "str?"
  # What the tunnel points at. Empty detects Home Assistant's own port.
  target: "str?"
  tunnel_label: "str?"
  log_level: "list(trace|debug|info|warn|error)?"
  # Forget the paired key and pair again on the next start. Stays on until
  # turned off, so every start re-pairs while it is on. The old service
  # account is left in Datum to delete by hand; the log names it.
  repair: "bool?"
